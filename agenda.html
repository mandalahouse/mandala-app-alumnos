<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Mandala — Agenda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="screen-inner">

    <div class="sbar">
      <span class="stime">09:41</span>
      <div class="sicons"><div class="sb"></div><div class="sb"></div><div class="sb"></div></div>
    </div>

    <div class="topnav">
      <div style="flex:1">
        <div class="wordmark"><span class="dim">MANDALA </span>AGENDA</div>
        <div class="topnav-sub">mayo — junio 2026</div>
      </div>
    </div>

    <div class="body">

      <!-- Calendario -->
      <div class="cal-wrap">
        <div class="cal-header">
          <span class="cal-month">Mayo 2026</span>
          <div class="cal-nav">
            <div class="cal-btn"><i class="ti ti-chevron-left"></i></div>
            <div class="cal-btn"><i class="ti ti-chevron-right"></i></div>
          </div>
        </div>
        <div class="cal-dow">
          <span>LU</span><span>MA</span><span>MI</span>
          <span>JU</span><span>VI</span><span>SA</span><span>DO</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>

      <!-- Próximas clases -->
      <div>
        <span class="sec-label">Próximas clases</span>

        <div class="class-card">
          <div class="cc-date">
            <span class="cc-dow">MIÉ</span>
            <span class="cc-num">04</span>
            <span class="cc-mon">JUN</span>
          </div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
              <span class="cc-tag">ENSAMBLE</span>
              <span class="cc-time">18:30</span>
            </div>
            <div class="cc-title">Ensamble de cuerdas</div>
            <div class="cc-teacher">Prof. García</div>
          </div>
          <i class="ti ti-chevron-right" style="font-size:14px;color:var(--muted);flex-shrink:0"></i>
        </div>

        <div class="class-card">
          <div class="cc-date">
            <span class="cc-dow">VIE</span>
            <span class="cc-num">06</span>
            <span class="cc-mon">JUN</span>
          </div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
              <span class="cc-tag">INDIVIDUAL</span>
              <span class="cc-time">17:00</span>
            </div>
            <div class="cc-title">Clase individual</div>
            <div class="cc-teacher">Prof. Martínez</div>
          </div>
          <i class="ti ti-chevron-right" style="font-size:14px;color:var(--muted);flex-shrink:0"></i>
        </div>

        <div class="class-card">
          <div class="cc-date">
            <span class="cc-dow">MIÉ</span>
            <span class="cc-num">11</span>
            <span class="cc-mon">JUN</span>
          </div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
              <span class="cc-tag">ENSAMBLE</span>
              <span class="cc-time">18:30</span>
            </div>
            <div class="cc-title">Ensamble de cuerdas</div>
            <div class="cc-teacher">Prof. García</div>
          </div>
          <i class="ti ti-chevron-right" style="font-size:14px;color:var(--muted);flex-shrink:0"></i>
        </div>

      </div>
    </div>

    <nav class="nav">
      <a class="ni" href="index.html"><i class="ti ti-home"></i><div class="ni-dot"></div></a>
      <a class="ni" href="#"><i class="ti ti-search"></i><div class="ni-dot"></div></a>
      <a class="ni" href="qml.html"><i class="ti ti-notebook"></i><div class="ni-dot"></div></a>
      <a class="ni on" href="agenda.html"><i class="ti ti-calendar"></i><div class="ni-dot"></div></a>
      <a class="ni" href="perfil.html"><i class="ti ti-user"></i><div class="ni-dot"></div></a>
    </nav>

  </div>
</div>

<script>
  const today = 29;
  const marked = [4, 6, 11, 18, 25];
  // Mayo 2026 empieza un viernes (índice 4 en semana LU–DO)
  const offset = 4;
  const totalDays = 31;
  const grid = document.getElementById('calGrid');

  for (let i = 0; i < offset; i++) {
    const blank = document.createElement('div');
    grid.appendChild(blank);
  }

  for (let d = 1; d <= totalDays; d++) {
    const cell = document.createElement('div');
    cell.className = 'cal-day' + (d < today ? ' past' : '') + (d === today ? ' today' : '');
    const num = document.createElement('span');
    num.textContent = d;
    cell.appendChild(num);
    if (marked.includes(d)) {
      const dot = document.createElement('div');
      dot.className = 'cal-dot';
      cell.appendChild(dot);
    }
    grid.appendChild(cell);
  }
</script>
</body>
</html>
