<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Mandala — Agenda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="screen-inner">

    <div class="topnav">
      <div style="flex:1">
        <div class="wordmark"><span class="dim">MANDALA </span>AGENDA</div>
        <div class="topnav-sub" id="agendaSub"></div>
      </div>
    </div>

    <div class="body">

      <div class="cal-wrap">
        <div class="cal-header">
          <span class="cal-month" id="calMonth"></span>
          <div class="cal-nav">
            <div class="cal-btn"><i class="ti ti-chevron-left"></i></div>
            <div class="cal-btn"><i class="ti ti-chevron-right"></i></div>
          </div>
        </div>
        <div class="cal-dow">
          <span>LU</span><span>MA</span><span>MI</span>
          <span>JU</span><span>VI</span><span>SA</span><span>DO</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>

      <div>
        <span class="sec-label">Próximas clases</span>

        <div class="class-card">
          <div class="cc-date">
            <span class="cc-dow">MIÉ</span>
            <span class="cc-num">04</span>
            <span class="cc-mon">JUN</span>
          </div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
              <span class="cc-tag">ENSAMBLE</span>
              <span class="cc-time">18:30</span>
            </div>
            <div class="cc-title">Ensamble de cuerdas</div>
            <div class="cc-teacher">Prof. García</div>
          </div>
          <i class="ti ti-chevron-right" style="font-size:21px;color:var(--muted);flex-shrink:0"></i>
        </div>

        <div class="class-card">
          <div class="cc-date">
            <span class="cc-dow">VIE</span>
            <span class="cc-num">06</span>
            <span class="cc-mon">JUN</span>
          </div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
              <span class="cc-tag">INDIVIDUAL</span>
              <span class="cc-time">17:00</span>
            </div>
            <div class="cc-title">Clase individual</div>
            <div class="cc-teacher">Prof. Martínez</div>
          </div>
          <i class="ti ti-chevron-right" style="font-size:21px;color:var(--muted);flex-shrink:0"></i>
        </div>

        <div class="class-card">
          <div class="cc-date">
            <span class="cc-dow">MIÉ</span>
            <span class="cc-num">11</span>
            <span class="cc-mon">JUN</span>
          </div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
              <span class="cc-tag">ENSAMBLE</span>
              <span class="cc-time">18:30</span>
            </div>
            <div class="cc-title">Ensamble de cuerdas</div>
            <div class="cc-teacher">Prof. García</div>
          </div>
          <i class="ti ti-chevron-right" style="font-size:21px;color:var(--muted);flex-shrink:0"></i>
        </div>
      </div>

    </div>

    <nav class="nav">
      <a class="ni" href="index.html"><i class="ti ti-home"></i><div class="ni-dot"></div></a>
      <a class="ni" href="checkin.html"><i class="ti ti-checkbox"></i><div class="ni-dot"></div></a>
      <a class="ni" href="qml.html"><i class="ti ti-notebook"></i><div class="ni-dot"></div></a>
      <a class="ni on" href="agenda.html"><i class="ti ti-calendar"></i><div class="ni-dot"></div></a>
      <a class="ni" href="perfil.html"><i class="ti ti-user"></i><div class="ni-dot"></div></a>
    </nav>

  </div>
</div>

<script>
  const ahora = new Date();
  const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const mesesCorto = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

  let viewYear = ahora.getFullYear();
  let viewMonth = ahora.getMonth();

  // Días con clases simuladas
  const marked = [4, 6, 11, 18, 25];

  function renderCal() {
    const today = ahora.getDate();
    const isCurrentMonth = viewYear === ahora.getFullYear() && viewMonth === ahora.getMonth();
    const totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();
    // 0=dom…6=sáb → convertir a lun=0…dom=6
    let startDay = new Date(viewYear, viewMonth, 1).getDay();
    startDay = startDay === 0 ? 6 : startDay - 1;

    document.getElementById('calMonth').textContent = meses[viewMonth] + ' ' + viewYear;
    document.getElementById('agendaSub').textContent = meses[viewMonth].toLowerCase() + ' — ' + meses[(viewMonth + 1) % 12].toLowerCase() + ' ' + viewYear;

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    for (let i = 0; i < startDay; i++) grid.appendChild(document.createElement('div'));

    for (let d = 1; d <= totalDays; d++) {
      const cell = document.createElement('div');
      const isPast = isCurrentMonth && d < today;
      const isToday = isCurrentMonth && d === today;
      cell.className = 'cal-day' + (isPast ? ' past' : '') + (isToday ? ' today' : '');
      const num = document.createElement('span');
      num.textContent = d;
      cell.appendChild(num);
      if (marked.includes(d)) {
        const dot = document.createElement('div');
        dot.className = 'cal-dot';
        cell.appendChild(dot);
      }
      grid.appendChild(cell);
    }
  }

  // Navegación meses
  document.querySelectorAll('.cal-btn')[0].addEventListener('click', () => {
    if (viewMonth === 0) { viewMonth = 11; viewYear--; } else viewMonth--;
    renderCal();
  });
  document.querySelectorAll('.cal-btn')[1].addEventListener('click', () => {
    if (viewMonth === 11) { viewMonth = 0; viewYear++; } else viewMonth++;
    renderCal();
  });

  renderCal();
</script>
</body>
</html>
