<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Mandala — Seleccioná materia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen">
  <div class="screen-inner">

    <div class="topnav">
      <a class="back-btn" href="index.html"><i class="ti ti-arrow-left"></i></a>
      <div style="flex:1">
        <div class="wordmark"><span class="dim">MANDALA </span>ENSAMBLES</div>
      </div>
    </div>

    <div class="body">

      <!-- Hero -->
      <div class="hero">
        <div class="hero-ghost">QML</div>
        <div class="page-tag" style="margin-bottom:8px">
          <div class="tag-dot"></div>
          <span class="tag-txt">registro de clase</span>
        </div>
        <div class="hero-title">¿PARA QUÉ<br>MATERIA<span style="color:var(--accent)">?</span></div>
        <div class="hero-sub" style="margin-top:8px">Seleccioná la clase que querés registrar</div>
      </div>

      <!-- Tarjetas de materia -->
      <div style="display:flex;flex-direction:column;gap:12px">

        <a class="mat-card" href="qml.html?materia=guitarra">
          <div class="mat-card-icon">
            <i class="ti ti-guitar-pick"></i>
          </div>
          <div class="mat-card-body">
            <div class="mat-card-title">Guitarra clásica</div>
            <div class="mat-card-teacher">Prof. García</div>
            <div class="mat-card-meta">
              <span class="mat-card-badge">Último QML: hace 3 días</span>
            </div>
          </div>
          <div class="mat-card-arrow">
            <i class="ti ti-arrow-right"></i>
          </div>
        </a>

        <a class="mat-card" href="qml.html?materia=piano">
          <div class="mat-card-icon">
            <i class="ti ti-piano"></i>
          </div>
          <div class="mat-card-body">
            <div class="mat-card-title">Piano</div>
            <div class="mat-card-teacher">Prof. Martínez</div>
            <div class="mat-card-meta">
              <span class="mat-card-badge">Último QML: hace 1 semana</span>
            </div>
          </div>
          <div class="mat-card-arrow">
            <i class="ti ti-arrow-right"></i>
          </div>
        </a>

        <a class="mat-card" href="qml.html?materia=teoria">
          <div class="mat-card-icon">
            <i class="ti ti-music"></i>
          </div>
          <div class="mat-card-body">
            <div class="mat-card-title">Teoría musical</div>
            <div class="mat-card-teacher">Prof. López</div>
            <div class="mat-card-meta">
              <span class="mat-card-new">Sin registros aún</span>
            </div>
          </div>
          <div class="mat-card-arrow">
            <i class="ti ti-arrow-right"></i>
          </div>
        </a>

      </div>

    </div>

    <nav class="nav">
      <a class="ni" href="index.html"><i class="ti ti-home"></i><div class="ni-dot"></div></a>
      <a class="ni" href="checkin.html"><i class="ti ti-checkbox"></i><div class="ni-dot"></div></a>
      <a class="ni on" href="qml-materia.html"><i class="ti ti-notebook"></i><div class="ni-dot"></div></a>
      <a class="ni" href="agenda.html"><i class="ti ti-calendar"></i><div class="ni-dot"></div></a>
      <a class="ni" href="perfil.html"><i class="ti ti-user"></i><div class="ni-dot"></div></a>
    </nav>

  </div>
</div>

</html>
